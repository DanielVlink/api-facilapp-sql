<!doctype html>
<html lang="pt-BR" data-theme="jotape">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <style id="facilapp-tema-critico">html[data-theme="jotape"],html[data-theme="jotape"] body{background:#bfd5a5;color:#171a10}html[data-theme="jotape"] iframe{background:#bfd5a5}</style>
    <title>Credenciais</title>
    <link rel="stylesheet" href="dependencias/vendor/tabulator.min.css">
    <link rel="stylesheet" href="dependencias/css/cadastros.css">
    <link rel="stylesheet" href="dependencias/themes/TemaFacilApp.css">
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; background: transparent; color: var(--fa-text); font: 11px Arial, sans-serif; }
        body { padding: 5px; }
        .conteudo { display: flex; flex-direction: column; min-height: calc(100vh - 10px); gap: 5px; }
        .titulo { height: 45px; padding: 7px; border: 1px solid var(--fa-border); border-radius: 7px; background: var(--fa-panel); }
        .titulo h1 { margin: 0; font-size: 27px; line-height: 29px; }
        .browse { flex: 1; min-height: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 5px; }
        .acoes { display: grid; grid-template-rows: 1fr 3.5fr 1fr 2fr 1fr 1fr; gap: 5px; }
        .grupo { display: flex; flex-direction: column; justify-content: space-evenly; gap: 5px; min-height: 0; padding: 5px; border: 1px solid var(--fa-border); border-radius: 7px; background: var(--fa-panel); }
        button { height: 38px; min-height: 38px; width: 100%; padding: 0 8px; border: 0; border-radius: 7px; background: var(--fa-primary); color: var(--fa-menu-button-text, #fff); text-align: left; font: 400 11px Arial, sans-serif; cursor: pointer; }
        button:disabled { background: var(--fa-menu-button-disabled-bg); cursor: default; }
        .cartao { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border: 1px solid var(--fa-border); border-radius: 7px; background: var(--fa-panel); }
        .barra { height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 7px; padding: 5px 7px; border-bottom: 1px solid var(--fa-border); background: var(--fa-panel-alt); }
        .barra strong { font-size: 11px; }
        .barra label { display: flex; align-items: center; gap: 5px; font-weight: 700; }
        input { width: 280px; height: 25px; padding: 3px 6px; border: 1px solid var(--fa-border); border-radius: 5px; background: var(--fa-field-bg); color: var(--fa-text); font: 400 11px Arial, sans-serif; }
        #tabela { flex: 1; min-height: 0; }
        .tabulator { height: 100% !important; border: 0; background: var(--fa-panel); font-size: 11px; }
        .tabulator .tabulator-header, .tabulator .tabulator-footer { background: var(--fa-panel-alt); border-color: var(--fa-border); }
        .tabulator .tabulator-header .tabulator-col { height: 28px; background: var(--fa-panel-alt); border-color: color-mix(in srgb, var(--fa-border) 45%, transparent); }
        .tabulator .tabulator-col-title { font-size: 11px; font-weight: 700; }
        .tabulator .tabulator-row { min-height: 35px; background: var(--fa-panel) !important; border-bottom: 1px solid color-mix(in srgb, var(--fa-border) 40%, transparent); }
        .tabulator .tabulator-row.tabulator-row-even { background: var(--fa-panel) !important; }
        .tabulator .tabulator-cell { min-height: 35px; padding: 4px 7px; border-right: 1px solid color-mix(in srgb, var(--fa-border) 38%, transparent); border-bottom: 0; font-size: 11px; }
        .tabulator .tabulator-row.tabulator-selected, .tabulator .tabulator-row.tabulator-selected .tabulator-cell { background: var(--fa-panel-alt) !important; color: var(--fa-text) !important; }
        .modal { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(23, 26, 16, .62); }
        .modal.aberto { display: block; }
        .modal iframe { width: 100%; height: 100%; border: 0; background: transparent; }
    </style>
    <style>
        /* Bloco espelhado da referência aprovada Empresas: somente nomes de classes adaptados. */
        html[data-theme="jotape"] .acoes { display: grid; grid-template-rows: 1fr 3.5fr 1fr 2fr 1fr 1fr; height: 100%; min-height: 0; gap: 5px !important; padding: 0; background: transparent; }
        html[data-theme="jotape"] .grupo { display: flex; flex-direction: column; gap: 5px !important; justify-content: space-evenly; min-height: 0; margin: 0 !important; padding: 5px; border-radius: 7px; }
        html[data-theme="jotape"] .grupo button { width: 100%; min-height: 38px; height: 38px; margin: 0; padding: 0 8px; text-align: left; }
        body { padding: 5px; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; }
        .conteudo { display: flex; flex-direction: column; min-height: calc(100vh - 10px); padding: 5px; }
        .titulo { height: auto; margin-bottom: 5px; padding: 7px; border-radius: 7px; }
        .titulo h1 { font-size: 27px; font-weight: 700; }
        .cartao { display: flex; flex-direction: column; height: auto; min-height: 0; overflow: hidden; padding: 0; border-radius: 7px; }
        #tabela { flex: 1 1 auto; min-height: 0; overflow: hidden; }
        .browse { flex: 1 1 auto; min-height: 0; align-items: stretch; grid-template-columns: 150px minmax(0, 1fr); gap: 5px; }
        .acoes { align-self: stretch; }
        .barra { padding: 5px 7px; }
        .barra, .barra strong, .barra label { font-size: 11px; font-weight: 700; }
        .barra input { min-width: 220px; height: 25px; padding: 3px 6px; font-size: 11px; font-weight: 400; }
        .barra label { display: inline-flex; align-items: center; gap: 5px; }
        html[data-theme="jotape"] .barra input { width: 280px; min-width: 0; }
        .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 7px; background: rgba(23, 26, 16, .62); }
        .modal.aberto { display: flex; }
        .modal iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent !important; box-shadow: none; }
        .tabulator, .tabulator .tabulator-header, .tabulator .tabulator-row { font-size: 11px; }
        .tabulator .tabulator-cell { font-size: 11px; font-weight: 400; padding: 4px 7px; }
        .tabulator .tabulator-col-title { font-size: 11px; font-weight: 700; }
        .tabulator .tabulator-row:nth-child(even), .tabulator .tabulator-row.tabulator-row-even, .tabulator .tabulator-row.tabulator-row-odd { background: var(--fa-panel) !important; }
        .tabulator .tabulator-row.tabulator-selected, .tabulator .tabulator-row.tabulator-row-even.tabulator-selected, .tabulator .tabulator-row.tabulator-row-odd.tabulator-selected, .tabulator .tabulator-row.tabulator-selected .tabulator-cell { background: var(--fa-panel-alt) !important; color: var(--fa-text) !important; }
        .tabulator .tabulator-row { border-bottom: 1px solid color-mix(in srgb,var(--fa-border) 38%,transparent) !important; }
        .tabulator .tabulator-cell { border-right: 1px solid color-mix(in srgb,var(--fa-border) 38%,transparent) !important; border-bottom: 0 !important; }
    </style>
</head>
<body>
    <main class="conteudo">
        <header class="titulo"><h1>Credenciais</h1></header>
        <section class="browse">
            <aside class="acoes" aria-label="Ações das credenciais">
                <div class="grupo"><button id="atualizar" type="button">↻ Atualizar</button></div>
                <div class="grupo"><button id="inserir" type="button">＋ Inserir</button><button id="alterar" type="button" disabled>✎ Alterar</button><button id="excluir" type="button" disabled>⊖ Excluir</button></div>
                <div class="grupo"><button id="imprimir" type="button">▣ Imprimir</button></div>
                <div class="grupo"><button id="csv" type="button">⇩ CSV</button><button id="excel" type="button">▦ Excel</button></div>
                <div class="grupo"><button id="colunas" type="button">☷ Colunas</button></div>
                <div class="grupo"><button id="sair" type="button">↪ Sair</button></div>
            </aside>
            <section class="cartao" aria-label="Credenciais cadastradas">
                <div class="barra"><strong>CREDENCIAIS CADASTRADAS</strong><label>Localizar: <input id="pesquisa" type="search" placeholder="nome, client ID ou ambiente"></label></div>
                <div id="tabela"></div>
            </section>
        </section>
    </main>
    <div id="modal" class="modal"><iframe id="editor" title="Editor de credencial"></iframe></div>
    <script src="dependencias/vendor/xlsx.full.min.js"></script>
    <script src="dependencias/vendor/tabulator.min.js"></script>
    <script>
        (() => {
            const api = location.port === '3000' ? 'http://127.0.0.1:5000' : '';
            const modal = document.getElementById('modal');
            const editor = document.getElementById('editor');
            const botoesSelecionados = [document.getElementById('alterar'), document.getElementById('excluir')];
            let tabela;
            const abrir = dados => {
                const url = new URL('UpdateCredenciais.html', location.href);
                // A versão evita que a ponte local reutilize um Update antigo após alterações visuais.
                url.searchParams.set('v', '20260827.0300');
                url.searchParams.set('api', api);
                url.searchParams.set('tema', document.documentElement.dataset.theme || 'jotape');
                if (dados) Object.entries(dados).forEach(([chave, valor]) => url.searchParams.set(chave, Array.isArray(valor) ? valor.join(',') : valor ?? ''));
                editor.src = url;
                modal.classList.add('aberto');
            };
            const carregar = async () => {
                const resposta = await fetch(api + '/api/console/credenciais');
                const dados = await resposta.json();
                if (!resposta.ok) throw new Error(dados.erro || 'Não foi possível carregar as credenciais.');
                tabela?.destroy();
                tabela = new Tabulator('#tabela', {
                    data: dados.credenciais || [], index: 'clientId', height: '100%', layout: 'fitColumns', selectableRows: 1,
                    pagination: true, paginationSize: 25, paginationSizeSelector: [25, 50, 100],
                    locale: 'pt-br', langs: { 'pt-br': { pagination: { first: 'Primeira', last: 'Última', prev: 'Anterior', next: 'Próxima', page_size: 'Linhas por página' } } },
                    columns: [
                        { title: 'Nome', field: 'nome', widthGrow: 2 },
                        { title: 'Client ID', field: 'clientId', widthGrow: 2 },
                        { title: 'Tipo', field: 'tipo', widthGrow: 1 },
                        { title: 'Criação', field: 'criadoEm', widthGrow: 1, formatter: cell => cell.getValue() ? new Date(cell.getValue()).toLocaleDateString('pt-BR') : '' }
                    ]
                });
                tabela.on('rowSelectionChanged', selecionados => botoesSelecionados.forEach(botao => botao.disabled = selecionados.length !== 1));
            };
            document.getElementById('atualizar').onclick = () => carregar().catch(alert);
            document.getElementById('inserir').onclick = () => abrir();
            document.getElementById('alterar').onclick = () => abrir(tabela.getSelectedData()[0]);
            document.getElementById('excluir').onclick = async () => {
                const credencial = tabela.getSelectedData()[0];
                if (!credencial || !confirm('Excluir esta credencial? Esta ação não pode ser desfeita.')) return;
                const resposta = await fetch(api + '/api/console/credenciais/' + encodeURIComponent(credencial.clientId), { method: 'DELETE' });
                if (!resposta.ok) throw new Error('Não foi possível excluir a credencial.');
                carregar();
            };
            document.getElementById('pesquisa').oninput = event => {
                const valor = event.target.value.trim();
                valor ? tabela.setFilter([{ field: 'nome', type: 'like', value: valor }, { field: 'clientId', type: 'like', value: valor }, { field: 'tipo', type: 'like', value: valor }], 'matchAny') : tabela.clearFilter();
            };
            document.getElementById('csv').onclick = () => tabela.download('csv', 'credenciais-facilapp.csv', { bom: true });
            document.getElementById('excel').onclick = () => tabela.download('xlsx', 'credenciais-facilapp.xlsx', { sheetName: 'Credenciais' });
            document.getElementById('imprimir').onclick = () => {
                // O relatório preserva o filtro atual e abre dentro do mesmo overlay do browse.
                sessionStorage.setItem('facilapp-credenciais-relatorio', JSON.stringify(tabela.getData('active')));
                const url = new URL('RptCredenciais.html', location.href);
                url.searchParams.set('tema', document.documentElement.dataset.theme || 'jotape');
                editor.src = url;
                modal.classList.add('aberto');
            };
            document.getElementById('colunas').onclick = () => {
                const visiveis = tabela.getColumns().filter(coluna => coluna.isVisible()).map(coluna => coluna.getField()).join(',');
                const url = new URL('ColunasCredenciais.html', location.href);
                url.searchParams.set('tema', document.documentElement.dataset.theme || 'jotape');
                url.searchParams.set('visiveis', visiveis);
                editor.src = url;
                modal.classList.add('aberto');
            };
            window.addEventListener('message', event => {
                if (event.data?.tipo === 'aplicar-colunas-credenciais') {
                    const campos = new Set(event.data.campos || []);
                    tabela.getColumns().forEach(coluna => campos.has(coluna.getField()) ? coluna.show() : coluna.hide());
                    modal.classList.remove('aberto');
                    editor.src = 'about:blank';
                    return;
                }
                if (event.data?.tipo === 'fechar-modal') { modal.classList.remove('aberto'); editor.src = 'about:blank'; carregar(); }
            });
            carregar().catch(erro => document.getElementById('tabela').textContent = erro.message);
        })();
    </script>
</body>
</html>
