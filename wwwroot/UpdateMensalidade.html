<!doctype html>
<html lang="pt-BR" data-theme="jotape"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar mensalidade</title><link rel="stylesheet" href="dependencias/themes/TemaFacilApp.css"><style>body{margin:0;padding:7px;font:12px Arial,sans-serif;background:transparent;color:var(--fa-text)}.modal{width:min(650px,calc(100vw - 14px));margin:8vh auto;border:1px solid var(--fa-border);border-radius:9px;overflow:hidden;background:var(--fa-panel)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--fa-panel-alt);border-bottom:1px solid var(--fa-border)}h1{margin:0;font-size:18px}header p{margin:3px 0 0;font-size:11px}.corpo{padding:12px}.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.item{padding:8px;border:1px solid var(--fa-border);border-radius:6px;background:var(--fa-field-bg)}.item small{display:block;opacity:.75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:flex;flex-direction:column;gap:4px;font-weight:bold}input{height:29px;padding:5px 7px;border:1px solid var(--fa-border);border-radius:5px;background:var(--fa-field-bg);color:var(--fa-text);font:inherit}.full{grid-column:1/-1}.acoes{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid var(--fa-border)}button{height:29px;padding:4px 10px;border:0;border-radius:5px;background:var(--fa-primary);color:#fff;font-weight:bold;cursor:pointer}.soft{background:var(--fa-panel-alt);color:var(--fa-text);border:1px solid var(--fa-border)}#erro{min-height:17px;color:#b42318;margin-top:7px}</style></head><body><section class="modal"><header><div><h1>Atualizar mensalidade</h1><p id="empresa">Carregando empresa...</p></div><button id="fechar" type="button">×</button></header><div class="corpo"><div class="resumo"><div class="item"><small>Modelo</small><b id="tipo">—</b></div><div class="item"><small>Último pagamento</small><b id="ultimo">—</b></div><div class="item"><small>Limite de acesso</small><b id="limite">—</b></div></div><form><div class="grid"><label>Data do pagamento *<input name="dataPagamento" type="datetime-local" required></label><label>Valor *<input name="valor" type="number" min="0.01" step="0.01" required placeholder="0,00"></label><label class="full">Referência<input name="referencia" maxlength="200" placeholder="PIX, boleto, recibo..."></label></div><p id="erro"></p><div class="acoes"><button id="cancelar" class="soft" type="button">Cancelar</button><button type="submit">Gravar pagamento</button></div></form></div></section><script type="module">import {chamarApi} from './dependencias/js/api-client.js';const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);let cnpj=q.get('cnpj')||'';const br=v=>v?new Date(v).toLocaleDateString('pt-BR'):'—';function fechar(){parent.postMessage({tipo:'fechar-mensalidade'},'*')}async function carregar(){try{const r=await chamarApi(`/api/console/empresas/${encodeURIComponent(cnpj)}/pagamentos`),p=r.pagamento||{},e=r.empresa||{};$('#empresa').textContent=e.nomeFantasia||e.razaoSocial||q.get('empresa')||cnpj;$('#tipo').textContent=p.tipoPagamento||'mensalidade';$('#ultimo').textContent=br(p.ultimoPagamento);$('#limite').textContent=br(p.limiteAcesso)}catch(e){$('#erro').textContent=e.message}}$('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),data={dataPagamento:new Date(f.get('dataPagamento')).toISOString(),valor:Number(f.get('valor')),referencia:String(f.get('referencia')||'').trim()};try{await chamarApi(`/api/console/empresas/${encodeURIComponent(cnpj)}/pagamentos`,{method:'POST',body:JSON.stringify(data)});fechar()}catch(x){$('#erro').textContent=x.message}});$('#fechar').onclick=fechar;$('#cancelar').onclick=fechar;window.addEventListener('message',e=>{if(e.data?.tipo==='mensalidade'){cnpj=e.data.empresa?.cnpj||cnpj;carregar()}});$('input[name=dataPagamento]').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);carregar();</script></body></html>
