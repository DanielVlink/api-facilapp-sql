<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <style id="facilapp-tema-critico">html[data-theme="jotape"],html[data-theme="jotape"] body{background:#bfd5a5;color:#171a10}html[data-theme="jotape"] iframe{background:#bfd5a5}</style>
    <title>Relatório de empresas</title>
    <style>
        @page { size: A4 portrait; margin: 7mm; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: transparent; color: #171a10; font: 11px Arial, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; padding: 14px; }
        .relatorio { width: min(900px, 100%); max-height: 82vh; overflow: auto; padding: 0 14px 14px; border: 1px solid #9caf77; border-radius: 7px; background: #d8e9c5; box-shadow: 0 8px 24px #171a1066; }
        header { display: flex; justify-content: space-between; align-items: center; margin: 0 -14px 10px; padding: 8px 14px; background: #bfd5a5; border-bottom: 1px solid #9caf77; font-size: 16px; font-weight: 700; }
        header button, .acoes button { height: 25px; padding: 3px 9px; border: 0; border-radius: 5px; background: #59651f; color: #fff; font-weight: 700; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 4px 7px; border: 1px solid #9caf77; text-align: left; }
        th { background: #c9ddb0; font-weight: 700; }
        .acoes { display: flex; justify-content: flex-end; gap: 7px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #9caf77; }
        @media print { html, body { background: #fff; } .relatorio { margin: 0; padding: 0; border: 0; background: #fff; box-shadow: none; } header { margin: 0 0 10px; padding: 0 0 8px; background: #fff; border-bottom: 2px solid #59651f; } header button, .acoes { display: none; } }
    </style>
</head>
<body>
    <section class="relatorio">
        <header><span>Relatório de empresas</span><button id="fechar" type="button" aria-label="Fechar">×</button></header>
        <table><thead><tr><th>Nome ou razão social</th><th>CNPJ</th><th>Cidade - UF</th><th>Telefone</th><th>Criação</th></tr></thead><tbody id="linhas"></tbody></table>
        <div class="acoes"><button id="imprimir" type="button">Imprimir</button><button id="cancelar" type="button">Cancelar</button></div>
    </section>
    <script>
        const escapar = (valor) => String(valor ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
        const dados = JSON.parse(sessionStorage.getItem("facilapp-empresas-relatorio") || "[]");
        document.querySelector("#linhas").innerHTML = dados.map((empresa) => `<tr><td>${escapar(empresa.razaoSocial)}</td><td>${escapar(empresa.cnpj)}</td><td>${escapar(`${empresa.cidade || ""} - ${empresa.uf || ""}`)}</td><td>${escapar(empresa.telefone)}</td><td>${escapar(empresa.criadoEm)}</td></tr>`).join("");
        const fechar = () => parent.postMessage({ tipo: "fechar-modal" }, "*");
        document.querySelector("#fechar").addEventListener("click", fechar);
        document.querySelector("#cancelar").addEventListener("click", fechar);
        document.querySelector("#imprimir").addEventListener("click", () => window.print());
        const cabecalho = document.querySelector("header"), cartao = document.querySelector(".relatorio");
        let arrastando = false, deslocamentoX = 0, deslocamentoY = 0;
        cabecalho.addEventListener("pointerdown", (evento) => {
            if (evento.target.closest("button")) return;
            const retangulo = cartao.getBoundingClientRect();
            arrastando = true; deslocamentoX = evento.clientX - retangulo.left; deslocamentoY = evento.clientY - retangulo.top;
            cartao.style.position = "fixed"; cartao.style.margin = "0"; cartao.style.left = `${retangulo.left}px`; cartao.style.top = `${retangulo.top}px`;
            cabecalho.setPointerCapture(evento.pointerId);
        });
        cabecalho.addEventListener("pointermove", (evento) => {
            if (!arrastando) return;
            const maxX = Math.max(7, innerWidth - cartao.offsetWidth - 7), maxY = Math.max(7, innerHeight - cartao.offsetHeight - 7);
            cartao.style.left = `${Math.min(maxX, Math.max(7, evento.clientX - deslocamentoX))}px`;
            cartao.style.top = `${Math.min(maxY, Math.max(7, evento.clientY - deslocamentoY))}px`;
        });
        cabecalho.addEventListener("pointerup", () => { arrastando = false; });
    </script>
</body>
</html>
